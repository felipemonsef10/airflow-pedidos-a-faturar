<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Vendas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            padding: 40px;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .tabela-estilizada {
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 0.9em;
            width: 100%;
            border-radius: 5px 5px 0 0;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .tabela-estilizada thead tr {
            background-color: #3498db;
            color: #ffffff;
            text-align: left;
            font-weight: bold;
        }
        .tabela-estilizada th,
        .tabela-estilizada td {
            padding: 12px 15px;
        }
        .tabela-estilizada tbody tr {
            border-bottom: 1px solid #dddddd;
            background-color: #ffffff;
        }
        .tabela-estilizada tbody tr:nth-of-type(even) {
            background-color: #f3f3f3;
        }
        .tabela-estilizada tbody tr:last-of-type {
            border-bottom: 2px solid #3498db;
        }
        .tabela-estilizada tbody tr:hover {
            background-color: #e8f4f8;
        }
    </style>
</head>
<body>

    <h1>Relatório de Vendas</h1>
    
    <table class="tabela-estilizada">
        <thead>
            <tr>
                
                    <th>Grupo</th>
                
                    <th>Quantidade</th>
                
            </tr>
        </thead>
        <tbody>
            
                <tr>
                    
                        <td>1101-REFRIGERADORES</td>
                    
                        <td>2.197</td>
                    
                </tr>
            
                <tr>
                    
                        <td>1102-FOGÕES E COOKTOPS</td>
                    
                        <td>2.366</td>
                    
                </tr>
            
                <tr>
                    
                        <td>1103-LAVANDERIA</td>
                    
                        <td>2.284</td>
                    
                </tr>
            
                <tr>
                    
                        <td>1104-CLIMATIZAÇÃO</td>
                    
                        <td>2.394</td>
                    
                </tr>
            
                <tr>
                    
                        <td>1105-PEQUENOS ELETROS</td>
                    
                        <td>2.296</td>
                    
                </tr>
            
                <tr>
                    
                        <td>1106-COZINHA</td>
                    
                        <td>2.303</td>
                    
                </tr>
            
                <tr>
                    
                        <td>1107-TV E ÁUDIO</td>
                    
                        <td>2.326</td>
                    
                </tr>
            
                <tr>
                    
                        <td>1108-CUIDADOS PESSOAIS</td>
                    
                        <td>2.266</td>
                    
                </tr>
            
                <tr>
                    
                        <td>Total</td>
                    
                        <td>18.432</td>
                    
                </tr>
            
        </tbody>
    </table>

</body>
</html>
